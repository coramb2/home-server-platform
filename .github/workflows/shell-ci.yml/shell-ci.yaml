# Builds the app screens on every pull request that touches them, so a
# breaking change (e.g. a major dependency bump) shows a red X before merge.
name: shell-ci

on:
  pull_request:
    paths: ['apps/shell/**', '.github/workflows/shell-ci.yml']
  push:
    branches: [main]
    paths: ['apps/shell/**']

# Least privilege: this job only needs to read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as caddy/Dockerfile (node:22-alpine)
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

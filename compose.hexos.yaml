# compose.hexos.yaml - HouseOS on HexOS / TrueNAS 25.10
# Database (PocketBase) + front door (Caddy) + private tunnel (Tailscale).
# No ports are opened on the server: Tailscale is the only way in.

services:
  pocketbase:
    build:
      context: ./modules/tickets
      args:
        PB_VERSION: "0.39.6"
    restart: unless-stopped
    volumes:
      - /mnt/SSDs/houseos/data/pb_data:/pb/pb_data

  # Front facing: serves the app screens, forwards /api/tickets to PocketBase
  caddy:
    image: houseos-caddy:v2
    build:
      context: .
      dockerfile: caddy/Dockerfile
      args:
        # Public push key (safe to commit)
        VITE_VAPID_PUBLIC_KEY: "BD7ReKq95VBU31okT2Gecs_m8WX6wvat1zjxgVnPf4R8Bvn1Xy3ChKSCkaZlKirTlwGIS9OUSyXXOvbym7SBor8"
    restart: unless-stopped
    # Live inside the Tailscale container's network. Caddy can only be
    # reached through the tunnel. (The temporary 8088 door is gone.)
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - pocketbase

    # private tunnel: Joins tailnet as "houseos" and serves HTTPS.
  tailscale:
    image: tailscale/tailscale:v1.98.4
    hostname: houseos
    restart: unless-stopped
    # One-time join key is outside repo
    env_file:
    - /mnt/SSDs/houseos/houseos.env
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - /mnt/SSDs/houseos/data/tailscale:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  # Notification push service: sends push notifications to the app.
  push:
    image: houseos-push:v1
    build:
      context: ./modules/push
    restart: unless-stopped
    # Has its own secrets file. The tunnel never sees these & this service never sees tunnel's key.
    env_file:
      - /mnt/SSDs/houseos/push.env
    environment:
      PB_URL: http://pocketbase:8090
    depends_on:
      - pocketbase